<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星語占星｜每日星座運勢</title>
<style>
  :root { --ink:#28233e; --muted:#77718d; --accent:#7657c8; --lav:#eee9ff; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
    color:var(--ink); background:radial-gradient(circle at 15% 15%,#fff 0,#f7f3ff 38%,#e9e2ff 100%);
    display:grid; place-items:center; padding:28px;
  }
  .shell { width:min(760px,100%); position:relative; }
  .corner-note {
    position:absolute; right:0; top:-43px; color:#6d5aa4; font-size:13px;
    background:#ffffffbd; border:1px solid #ded5f5; padding:8px 12px;
    border-radius:999px; box-shadow:0 5px 18px #4c367018;
  }
  .panel {
    background:#ffffffed; border:1px solid #fff; border-radius:28px;
    padding:clamp(24px,5vw,48px); box-shadow:0 24px 70px #44316d20;
  }
  .eyebrow { color:var(--accent); letter-spacing:.18em; font-size:12px; font-weight:700; }
  h1 { font-size:clamp(30px,6vw,46px); margin:10px 0 8px; letter-spacing:.04em; }
  .intro { color:var(--muted); margin:0 0 28px; line-height:1.8; }
  label { display:block; font-weight:700; margin-bottom:10px; }
  .controls { display:flex; gap:12px; flex-wrap:wrap; }
  input {
    flex:1 1 220px; min-width:0; padding:14px 16px; border:1px solid #dcd5ed;
    border-radius:14px; font:inherit; color:var(--ink); background:#fcfbff;
  }
  button {
    border:0; border-radius:14px; padding:14px 24px; background:var(--accent);
    color:white; font:inherit; font-weight:700; cursor:pointer; transition:.2s;
  }
  button:hover { background:#6243b4; transform:translateY(-1px); }
  .error { color:#b23d62; min-height:24px; margin:9px 0 0; font-size:14px; }
  .result {
    display:none; margin-top:28px; padding:24px; border-radius:22px;
    background:linear-gradient(135deg,#f6f2ff,#fff9fc); border:1px solid #e8e0fb;
  }
  .result.show { display:block; animation:rise .35s ease-out; }
  @keyframes rise { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
  .signline { display:flex; align-items:center; gap:16px; margin-bottom:18px; }
  .symbol { width:64px; height:64px; display:grid; place-items:center; flex:none;
    border-radius:20px; background:#e8e0ff; font-size:34px; }
  h2 { margin:0 0 4px; font-size:25px; }
  .date { color:var(--muted); font-size:13px; }
  .fortune { line-height:1.9; margin:14px 0 20px; }
  .scores { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .score { background:#fff; border:1px solid #eee8fa; border-radius:14px; padding:13px; }
  .score span { display:block; color:var(--muted); font-size:12px; margin-bottom:5px; }
  .score strong { color:var(--accent); font-size:18px; }
  .tip { margin:18px 0 0; padding-top:15px; border-top:1px solid #e8e0f4; font-size:14px; }
  footer { text-align:center; color:#918aa4; font-size:12px; margin-top:20px; }
  @media(max-width:480px) { body{padding:52px 16px 24px} .corner-note{top:-42px;font-size:12px} .scores{grid-template-columns:1fr} }
</style>
</head>
<body>
<main class="shell">
  <div class="corner-note">星語小提醒｜運勢僅供參考，保持好奇與好心情。</div>
  <section class="panel">
    <div class="eyebrow">YOUR DAILY COSMIC GUIDE</div>
    <h1>今天的星星，想告訴你什麼？</h1>
    <p class="intro">輸入你的出生日期，探索專屬星座與今日運勢。讓星象成為靈感，替新的一天增添一點方向。</p>

    <form id="birthForm">
      <label for="birthday">你的出生日期</label>
      <div class="controls">
        <input id="birthday" type="date" required>
        <button type="submit">查看我的運勢 ✦</button>
      </div>
      <p class="error" id="error" aria-live="polite"></p>
    </form>

    <section class="result" id="result" aria-live="polite">
      <div class="signline">
        <div class="symbol" id="symbol">♈</div>
        <div><h2 id="signName">牡羊座</h2><div class="date" id="birthRange"></div></div>
      </div>
      <div class="date" id="today"></div>
      <p class="fortune" id="fortune"></p>
      <div class="scores">
        <div class="score"><span>整體運勢</span><strong id="overall"></strong></div>
        <div class="score"><span>愛情運勢</span><strong id="love"></strong></div>
        <div class="score"><span>工作／學業</span><strong id="work"></strong></div>
      </div>
      <p class="tip" id="tip"></p>
    </section>
    <footer>✧ 星座運勢為趣味參考，重要決定仍請相信自己的判斷 ✧</footer>
  </section>
</main>
<script>
const signs = [
  {name:"摩羯座",symbol:"♑",range:"12/22－1/19",start:[12,22],end:[1,19]},
  {name:"水瓶座",symbol:"♒",range:"1/20－2/18",start:[1,20],end:[2,18]},
  {name:"雙魚座",symbol:"♓",range:"2/19－3/20",start:[2,19],end:[3,20]},
  {name:"牡羊座",symbol:"♈",range:"3/21－4/19",start:[3,21],end:[4,19]},
  {name:"金牛座",symbol:"♉",range:"4/20－5/20",start:[4,20],end:[5,20]},
  {name:"雙子座",symbol:"♊",range:"5/21－6/21",start:[5,21],end:[6,21]},
  {name:"巨蟹座",symbol:"♋",range:"6/22－7/22",start:[6,22],end:[7,22]},
  {name:"獅子座",symbol:"♌",range:"7/23－8/22",start:[7,23],end:[8,22]},
  {name:"處女座",symbol:"♍",range:"8/23－9/22",start:[8,23],end:[9,22]},
  {name:"天秤座",symbol:"♎",range:"9/23－10/23",start:[9,23],end:[10,23]},
  {name:"天蠍座",symbol:"♏",range:"10/24－11/22",start:[10,24],end:[11,22]},
  {name:"射手座",symbol:"♐",range:"11/23－12/21",start:[11,23],end:[12,21]}
];
const fortunes = [
  ["今天適合把注意力放回真正重要的事。你可能遇到新的點子或合作邀請，先聆聽、再評估，會比急著做決定更有收穫。","主動表達感受能讓關係更靠近；單身者不妨給一場輕鬆對話機會。","整理優先順序，逐步完成手邊任務，成果會比想像中穩定。","給自己一段不被打擾的時間，答案會慢慢清晰。"],
  ["今天的節奏適合穩中求進。小小的改變可能帶來意外驚喜，別因為習慣而錯過值得嘗試的機會。","溫柔而坦率的交流最加分，記得也留空間給對方。","把大目標拆成小步驟，專注完成一件事就很棒。","喝杯水、伸展一下，讓身心重新充電。"],
  ["你的直覺今天相當敏銳，但重要事情仍值得多確認一次。保持彈性，能幫你把突發狀況變成新契機。","分享日常比刻意安排驚喜更能增進親密感。","適合腦力激盪與創意發想，記得把靈感記錄下來。","散步或聽音樂，讓思緒慢慢沉澱。"],
  ["今天是展現行動力的好時機。先踏出小小一步，就能打破拖延；遇到不同意見時，耐心溝通會帶來更好的結果。","勇敢說出期待，但別忘了傾聽彼此真正的需要。","主動承擔能讓人看見你的能力，細節也要仔細檢查。","安排一件讓自己開心的小事，補充能量。"]
];
const form=document.getElementById("birthForm");
form.addEventListener("submit",e=>{
  e.preventDefault();
  const value=document.getElementById("birthday").value;
  const error=document.getElementById("error");
  const result=document.getElementById("result");
  error.textContent="";
  if(!value){error.textContent="請先選擇出生日期。";return;}
  const birth=new Date(value+"T12:00:00");
  const now=new Date();
  if(Number.isNaN(birth.getTime())||birth>now){error.textContent="請輸入有效的出生日期，且不可晚於今天。";return;}
  const m=birth.getMonth()+1,d=birth.getDate();
  const sign=signs.find(s=>{
    const n=m*100+d, a=s.start[0]*100+s.start[1], b=s.end[0]*100+s.end[1];
    return a>b ? n>=a||n<=b : n>=a&&n<=b;
  });
  const seed=now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate()+m*31+d;
  const idx=seed%fortunes.length, data=fortunes[idx];
  const scores=[["★★★★☆","★★★☆☆","★★★★☆"],["★★★★★","★★★★☆","★★★☆☆"],["★★★★☆","★★★★★","★★★☆☆"],["★★★☆☆","★★★★☆","★★★★★"]][idx];
  document.getElementById("symbol").textContent=sign.symbol;
  document.getElementById("signName").textContent=sign.name;
  document.getElementById("birthRange").textContent="日期區間："+sign.range;
  document.getElementById("today").textContent="今日日期："+now.toLocaleDateString("zh-TW",{year:"numeric",month:"long",day:"numeric"});
  document.getElementById("fortune").textContent=data[0];
  document.getElementById("overall").textContent=scores[0];
  document.getElementById("love").textContent=scores[1];
  document.getElementById("work").textContent=scores[2];
  document.getElementById("tip").textContent="✦ 今日小提醒："+data[3];
  result.classList.remove("show"); void result.offsetWidth; result.classList.add("show");
});
</script>
</body>
</html>
